<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eminent Education – Online Enrolment</title>
</head>
<body>
 <h1>Eminent Education – Online Enrolment</h1>
  <p>Enrolment form prototype. Please use fictitious data only.</p>

  <form id="enrolment-form">
    <label for="full-name">Full name</label>
    <input id="full-name" name="fullName" type="text" required>

    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required>

    <label for="course">Course</label>
    <select id="course" name="course" required>
      <option value="">Select a course</option>
      <option value="diploma-it">Diploma of IT</option>
    </select>

    <button type="submit">Submit enrolment</button>
  </form>

  <p id="message" role="status"></p>

  <script>
    document.getElementById("enrolment-form")
      .addEventListener("submit", function (event) {
        event.preventDefault();
        document.getElementById("message").textContent =
          "Form validation complete. No data has been saved or sent.";
      });
  </script>
</body>
</html>
